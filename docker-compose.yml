x-backend-env: &backend-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://hookhaven:hookhaven@db:5432/hookhaven
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookhaven
      POSTGRES_PASSWORD: hookhaven
      POSTGRES_DB: hookhaven
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookhaven"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
